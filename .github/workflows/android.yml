name: Build Android APK

# Manual trigger from the Actions tab (or via: gh workflow run android.yml)
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (www/)
        run: node scripts/build-www.mjs

      - name: Add & sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch Android project (version + signing + stable IME viewport)
        run: node scripts/set-android-version.mjs

      - name: Generate adaptive app icons from assets/
        run: npx @capacitor/assets generate --android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LifeArchive-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeArchive-debug-apk
          path: LifeArchive-debug.apk
          if-no-files-found: error
